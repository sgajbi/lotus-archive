repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff pinned in pyproject.toml. pre-commit never reads
    # requirements -- it resolves each hook from this rev -- so the two drift
    # independently and the hook can disagree with CI about what formatted
    # means. Measured here that 0.15.0 and 0.15.1 agree on this tree, so the
    # divergence was latent rather than active; it is the drift that is the
    # defect, not today's outcome.
    rev: v0.15.0
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: ["--config-file", "mypy.ini"]
        pass_filenames: false

