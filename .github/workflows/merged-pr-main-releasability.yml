name: Merged PR Main Releasability Dispatch

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: write

jobs:
  dispatch-main-releasability:
    name: Dispatch Main Releasability
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Every revision the PR added must be enumerable, not just the head.
          fetch-depth: 0
      - name: Dispatch main releasability gate for every merged revision
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$MERGE_COMMIT_SHA" ]; then
            echo "::error::pull_request.merge_commit_sha is required for exact-main releasability dispatch"
            exit 1
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "::error::pull_request.base.sha is required to bound the enumeration window"
            exit 1
          fi

          # This enumeration is correct ONLY under rebase-only merging: a
          # squash lands one commit however many the PR held (N-1 dispatches
          # would name commits from earlier PRs), and a merge commit adds a
          # second parent (the walk would descend into main's own history).
          # Gating the wrong trees while reporting success is worse than the
          # coverage gap this dispatcher closes, so fail loudly if the
          # repository's merge methods ever change.
          merge_methods="$(gh api "repos/$GITHUB_REPOSITORY" \
            --jq '[.allow_squash_merge, .allow_merge_commit, .allow_rebase_merge] | @csv')"
          if [ "$merge_methods" != "false,false,true" ]; then
            echo "::error::Merge methods changed ($merge_methods); per-commit enumeration assumes rebase-only merging. Update the dispatcher before merging anything."
            exit 1
          fi

          git fetch origin main --quiet
          # Judge ancestry against the freshly fetched main, not the event-time
          # checkout snapshot.
          git checkout --quiet --detach FETCH_HEAD
          # Enumerate by RANGE, not by count. `pull_request.commits` describes
          # the branch when the event fired, not what landed: a rebase that
          # drops a commit already on main leaves the count larger than the
          # window, and `rev-list -n COUNT` then walks past the PR's history
          # into commits earlier merges put there. Those are genuine ancestors
          # of main and genuinely number COUNT, so the ancestry guard below and
          # a count assertion BOTH pass on a wrong enumeration.
          #
          # Latent here rather than fired -- no merged PR in this repository's
          # recent history declared more commits than it landed -- but it has
          # fired in the estate. lotus-risk PR #270 declared 4 and landed 3, so
          # the walk reached the base commit added by an earlier PR;
          # lotus-gateway PR #744 reached base.sha, and because a commit is its
          # own ancestor the guard refused the whole dispatch and nothing was
          # gated. Reported estate-wide by lotus-platform-47 as
          # lotus-platform#859.
          revisions="$(git rev-list --reverse "$BASE_SHA..$MERGE_COMMIT_SHA")"
          if [ -z "$revisions" ]; then
            echo "::error::No revisions enumerated for merged PR #$PR_NUMBER at $MERGE_COMMIT_SHA"
            exit 1
          fi

          # The count stays as an ASYMMETRIC cross-check, because the two
          # directions mean opposite things. Fewer revisions than the count is
          # the ordinary rebase case -- a stale count over a complete window --
          # and must not fail. More is the dangerous direction: the range spans
          # revisions this PR did not add, which means BASE_SHA is not the base
          # this merge actually built on.
          revision_count="$(printf '%s\n' "$revisions" | wc -l | tr -d ' ')"
          if [ "$revision_count" -gt "$COMMIT_COUNT" ]; then
            echo "::error::Enumerated $revision_count revisions in $BASE_SHA..$MERGE_COMMIT_SHA but PR #$PR_NUMBER declared $COMMIT_COUNT; the range spans revisions the PR did not add."
            exit 1
          fi
          if [ "$revision_count" -lt "$COMMIT_COUNT" ]; then
            echo "::notice::PR #$PR_NUMBER declared $COMMIT_COUNT commits and landed $revision_count; enumerating the landed range."
          fi

          for revision in $revisions; do
            # A revision that is not on the fetched main (for example after a
            # forced move of main between the merge event and this checkout)
            # must never be tagged or gated as main history.
            if ! git merge-base --is-ancestor "$revision" HEAD; then
              echo "::error::Revision $revision is not an ancestor of main; refusing to dispatch."
              exit 1
            fi
            dispatch_ref="main-releasability-${revision}"
            existing_ref_sha=""
            if existing_ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$dispatch_ref" --jq .object.sha 2>/dev/null)"; then
              if [ "$existing_ref_sha" != "$revision" ]; then
                echo "::error::Dispatch ref $dispatch_ref points to $existing_ref_sha, expected $revision"
                exit 1
              fi
            else
              existing_ref_sha=""
            fi
            if [ -z "$existing_ref_sha" ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$dispatch_ref" \
                -f sha="$revision" >/dev/null
            fi
            gh workflow run main-releasability.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$dispatch_ref" \
              -f expected_sha="$revision" \
              -f triggering_pr="$PR_NUMBER" \
              -f source_branch="main"
            echo "Dispatched main releasability for $revision (PR #$PR_NUMBER)"
          done
